# TuttiBox Application Configuration
spring.application.name=tuttibox

# Server
server.port=8080

# Database Configuration: In-memory H2 with PostgreSQL compatibility mode for instant local dev run
spring.datasource.url=jdbc:h2:mem:tuttibox;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Problem Details standard (RFC 7807)
spring.mvc.problemdetails.enabled=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=geocodingCache

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Business Rules (Synchronized with Section 2.3 of the Technical Report)
tuttibox.rules.dropoff-deadline-hours=48
tuttibox.rules.pickup-deadline-hours=72
tuttibox.rules.pin-max-failed-attempts=3
tuttibox.rules.pin-lockout-duration-seconds=60
tuttibox.rules.allow-s-to-m-fallback=true

# External Geocoding (OpenStreetMap Nominatim)
tuttibox.geocoding.nominatim-url=https://nominatim.openstreetmap.org
tuttibox.geocoding.user-agent=TuttiBox-UniversityOfAveiro-TQS-119495
tuttibox.geocoding.rate-limit-requests-per-second=1
